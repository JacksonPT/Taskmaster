schema: spec-driven

context: |
  Product: Taskmaster, an AI-assisted personal task manager built as a step-by-step learning project.
  Stack: Next.js 16 App Router, React 19, TypeScript, Tailwind CSS 4, shadcn/Base UI, Prisma 7, Neon PostgreSQL, Clerk, Vercel AI SDK 7, Google Gemini, and Zod 4.
  Architecture: Next.js Server Components load private data; Client Components own interactive state; authenticated Server Actions validate input and enforce ownership near Prisma access; provider code and secrets remain server-only.
  Completed modules: 1 project foundation, 2 landing page, 3 task workspace, 4 task lifecycle interactions, 5 Prisma/PostgreSQL foundation, 6 persisted task management, 7 Clerk authentication, 8 private task ownership, 9 AI priority suggestions, 10 AI completion plans, 11 quota-limited daily planning with persisted manual ordering, 11.1 responsive daily-plan sidebar, 12 deterministic completion encouragement, 14 trusted progress dashboard metrics, 14.1 simplified command-center header with a responsive metric ribbon, and 15 risk-based testing, accessibility, security regression, and failure-path hardening. Module 13 was intentionally removed.
  Next module: 16 deployment, environment configuration, CI checks, observability, final documentation, and portfolio readiness.
  Remaining learning roadmap: 16 deployment and portfolio readiness.
  Product constraints: preserve user-owned data isolation, validate all AI output, keep Gemini calls bounded, never expose environment secrets, and do not spend AI quota for deterministic UI operations.
  Teaching style: add concise comments for non-obvious technology and control flow so files can be read top-down; avoid comments that merely restate syntax.
  Collaboration style: implement one module at a time. During apply, ask one focused question at a time before each major task group, then continue after the answer. End each module with changed files in reading order, verification results, a small flow, and reusable lessons.
  Engineering style: prefer the smallest correct change, preserve established visual language, support desktop and mobile, and run Prisma validation/generation when relevant plus formatting, lint, typecheck, build, and git diff checks.

rules:
  proposal:
    - Identify the module number and its learning goal.
    - Separate current behavior, requested behavior, and explicit non-goals.
    - Keep proposals focused on one implementable module unless establishing baseline project specifications.
  design:
    - Explain why key technical choices fit the existing Taskmaster architecture.
    - Include security, quota, responsive-design, persistence, and rollback considerations when relevant.
    - State where learning comments are useful and where comments would be noise.
  specs:
    - Write testable user-visible or architectural requirements with exact WHEN/THEN scenarios.
    - Preserve current security and ownership guarantees unless a proposal explicitly changes them.
  tasks:
    - Group work into numbered learning steps that can be completed and verified independently.
    - Put a one-question user checkpoint before each major implementation group; questions must be asked one at a time during apply.
    - Include top-down comments, responsive verification, automated checks, reading order, and learning-summary tasks.
