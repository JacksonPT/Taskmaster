services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskmaster_test
      POSTGRES_PASSWORD: taskmaster
      POSTGRES_USER: taskmaster
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster -d taskmaster_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
